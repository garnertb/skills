name: Validate Skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Validate skills
        run: ./scripts/validate-skills

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm i
      
      - name: Check code formatting
        run: pnpm format:check

  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run skill script tests
        run: |
          find skills -name 'test_*.py' -exec dirname {} \; | sort -u | while read -r dir; do
            echo "::group::$dir"
            python -m unittest discover -s "$dir" -v
            echo "::endgroup::"
          done
